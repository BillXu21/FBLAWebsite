{% extends "base.html" %}
{% block title %}Employer Registration{% endblock %}

{% block content %}
<h1>Register as an Employer</h1>
<form method="post">
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required>
    </div>

    <div class="mb-3">
        <label for="first_name" class="form-label">First Name</label>
        <input type="text" class="form-control" name="first_name" required>
    </div>

    <div class="mb-3">
        <label for="last_name" class="form-label">Last Name</label>
        <input type="text" class="form-control" name="last_name" required>
    </div>

    <div class="mb-3">
        <label for="phone_number" class="form-label">Phone Number</label>
        <input type="text" class="form-control" name="phone_number">
    </div>

    <div class="mb-3">
        <label for="preferred_contact_method" class="form-label">Preferred Contact Method</label>
        <input type="text" class="form-control" name="preferred_contact_method">
    </div>

    <div class="mb-3">
        <label for="address" class="form-label">Company Address</label>
        <input type="text" class="form-control" name="address">
    </div>

    <div class="mb-3">
        <label for="bio" class="form-label">Company Description</label>
        <textarea class="form-control" name="bio"></textarea>
    </div>

    <input type="hidden" name="user_type" value="employer">
    <button type="submit" class="btn btn-primary">Register</button>
</form>
{% endblock %}
