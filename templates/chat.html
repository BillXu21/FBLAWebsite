{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Chat with: {{ other_user_email }}</h2>
    <div id="chat-container" class="card mt-3">
        <div id="messages" class="card-body" style="height: 300px; overflow-y: auto; border: 1px solid #ccc;">
            <!-- Messages will be dynamically loaded here -->
        </div>
    </div>

    <form id="send-message-form" class="mt-3">
        <div class="input-group">
            <input type="text" id="message-input" class="form-control" placeholder="Type your message" required autocomplete="off">
            <button type="submit" class="btn btn-primary">Send</button>
        </div>
    </form>
</div>

<script>
    const conversationId = {{ conversation_id }}; // Provided from the server
    const otherUserEmail = "{{ other_user_email }}"; // Provided from the server

    // Function to load messages from the server
    async function loadMessages() {
        try {
            const response = await fetch(`/messages/${conversationId}`);
            const messages = await response.json();

            const messagesDiv = document.getElementById("messages");
            messagesDiv.innerHTML = ""; // Clear existing messages

            messages.forEach(msg => {
                const senderName = msg.sender_email || "[Unknown Sender]";
                const messageElement = document.createElement("div");
                messageElement.className = "mb-2";
                messageElement.innerHTML = `<strong>${senderName}</strong>: ${msg.content}`;
                messagesDiv.appendChild(messageElement);
            });

            // Scroll to the bottom of the chat
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } catch (error) {
            console.error("Error loading messages:", error);
        }
    }

    // Event listener for the message form submission
    document.getElementById("send-message-form").addEventListener("submit", async function(event) {
        event.preventDefault();
        const messageInput = document.getElementById("message-input");

        try {
            // Send message to the server
            const response = await fetch(`/messages/send`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    conversation_id: conversationId,
                    content: messageInput.value
                })
            });

            if (response.ok) {
                messageInput.value = ""; // Clear the input field after sending
                loadMessages(); // Refresh messages
            } else {
                console.error("Failed to send message");
            }
        } catch (error) {
            console.error("Error sending message:", error);
        }
    });

    // Load messages initially
    loadMessages();

    // Optional: Refresh messages periodically
    setInterval(loadMessages, 2000);
</script>
{% endblock %}
