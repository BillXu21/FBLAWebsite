{% extends "base.html" %}
{% block title %}Apply for Job{% endblock %}
{% block content %}
<div class="container">
    <h2>Apply for {{ job.job_title }}</h2>
    <p><strong>Company:</strong> {{ job.company_name }}</p>
    <p><strong>Description:</strong> {{ job.description }}</p>
    <p><strong>Skills Required:</strong> {{ job.skills }}</p>

    <form action="{{ url_for('apply_job', job_id=job.id) }}" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required value="{{ session.get('user_email', '') }}">
        </div>

        <div class="mb-3">
            <label for="resume" class="form-label">Upload Resume (PDF only)</label>
            <input type="file" class="form-control" id="resume" name="resume" accept=".pdf" required>
        </div>

        <button type="submit" class="btn btn-primary">Submit Application</button>
    </form>
</div>
{% endblock %}
